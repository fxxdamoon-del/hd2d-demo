<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>HD2D 村庄 · 噬运军团技术演示</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --ink:#241a12; --wood:#54382a; --wood-lt:#6e4f3a; --cream:#faf3d8;
    --gold:#c9a227; --gold-lt:#e8c179; --grass:#8a9a6b; --steel:#7a9ab0;
    --red:#c05a4a; --leaf:#7ab86a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#f7e9c4;
    font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;
    overscroll-behavior:none;}
  #app{position:fixed;inset:0;}
  #app canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}

  /* ---------- HUD ---------- */
  .hud{position:fixed;z-index:10;color:var(--ink);user-select:none;pointer-events:none;}
  #title{top:calc(10px + env(safe-area-inset-top));left:12px;background:var(--cream);
    border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(36,26,18,.45);padding:6px 10px;}
  #title b{font-size:17px;letter-spacing:1px;color:var(--wood);}
  #title span{display:block;font-size:11px;color:#8a6d1f;margin-top:2px;}
  #counter{top:calc(10px + env(safe-area-inset-top));right:12px;background:var(--cream);
    border:3px solid var(--ink);box-shadow:4px 4px 0 rgba(36,26,18,.45);padding:7px 10px;
    font-size:14px;font-weight:bold;color:var(--wood);}
  #counter i{font-style:normal;color:var(--red);}
  #hint{bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    font-size:12px;color:#5a4632;background:rgba(250,243,216,.85);border:2px solid var(--wood);
    padding:4px 10px;white-space:nowrap;}
  @media (pointer:coarse){ #hint{display:none;} }

  /* ---------- 虚拟摇杆 ---------- */
  #joy{position:fixed;z-index:20;left:calc(18px + env(safe-area-inset-left));
    bottom:calc(22px + env(safe-area-inset-bottom));width:124px;height:124px;
    border:3px solid var(--ink);background:rgba(250,243,216,.28);
    box-shadow:4px 4px 0 rgba(36,26,18,.35);touch-action:none;}
  #joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;
    background:var(--cream);border:3px solid var(--ink);
    box-shadow:3px 3px 0 rgba(36,26,18,.4);}
  #joyKnob::after{content:"";position:absolute;inset:14px;background:var(--gold);}
  #joyLabel{position:absolute;left:0;right:0;bottom:-20px;text-align:center;font-size:11px;color:#5a4632;}

  /* ---------- 攻击按钮 ---------- */
  #atkBtn{position:fixed;z-index:20;right:calc(20px + env(safe-area-inset-right));
    bottom:calc(30px + env(safe-area-inset-bottom));width:92px;height:92px;
    background:var(--gold);border:3px solid var(--ink);color:var(--ink);
    font-family:inherit;font-size:20px;font-weight:bold;letter-spacing:2px;
    box-shadow:5px 5px 0 rgba(36,26,18,.45);touch-action:none;cursor:pointer;}
  #atkBtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 rgba(36,26,18,.45);background:var(--gold-lt);}
  #atkBtn small{display:block;font-size:11px;letter-spacing:0;color:#5a4632;margin-top:2px;}

  /* ---------- 胜利横幅 ---------- */
  #win{position:fixed;z-index:30;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(36,26,18,.45);}
  #win.show{display:flex;}
  #winCard{background:var(--cream);border:4px solid var(--ink);
    box-shadow:8px 8px 0 rgba(36,26,18,.5);padding:26px 34px;text-align:center;
    animation:pop .28s steps(4) both;}
  @keyframes pop{from{transform:scale(.7);}to{transform:scale(1);}}
  #winCard h1{font-size:40px;color:var(--gold);letter-spacing:6px;
    text-shadow:3px 3px 0 var(--ink);margin-bottom:8px;}
  #winCard p{font-size:14px;color:var(--wood);margin-bottom:18px;}
  #againBtn{background:var(--gold);border:3px solid var(--ink);color:var(--ink);
    font-family:inherit;font-size:18px;font-weight:bold;letter-spacing:2px;padding:10px 22px;
    box-shadow:4px 4px 0 rgba(36,26,18,.45);cursor:pointer;}
  #againBtn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 rgba(36,26,18,.45);}

  /* ---------- 加载 / 失败 ---------- */
  #loading{position:fixed;z-index:40;inset:0;background:#f7e9c4;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--wood);}
  #loading .box{width:34px;height:34px;background:var(--gold);border:3px solid var(--ink);
    animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:.25;}}
  #loading p{font-size:15px;font-weight:bold;letter-spacing:2px;}
  #loading small{font-size:12px;color:#8a6d1f;}
  #loading.err .box{animation:none;background:var(--red);}

  /* ---------- 窄屏：标题别跟计数器打架，提示条别挡摇杆 ---------- */
  @media (max-width:600px){
    #title{padding:5px 8px;max-width:56%;}
    #title b{font-size:14px;}
    #title span{font-size:10px;}
    #counter{padding:5px 8px;font-size:12px;}
    #hint{display:none;}
    #atkBtn{width:78px;height:78px;font-size:17px;}
  }
  /* 桌面细指针：摇杆是手机用的，藏起来 */
  @media (pointer:fine){ #joy{display:none;} }
</style>
</head>
<body>
<div id="app"></div>

<div class="hud" id="title"><b>HD2D 村庄</b><span>像素小人 × 3D 田园 · 噬运军团技术演示</span></div>
<div class="hud" id="counter">剩余史莱姆：<i id="slimeLeft">3</i> / 3</div>
<div class="hud" id="hint">WASD / 方向键移动 · 空格攻击 · 点史莱姆攻击</div>

<div id="joy"><div id="joyKnob"></div><div id="joyLabel">移动</div></div>
<button id="atkBtn" type="button">攻击<small>空格 / 点按</small></button>

<div id="win"><div id="winCard">
  <h1>胜利！</h1>
  <p>3 只史莱姆全部打倒了，村庄安全了。</p>
  <button id="againBtn" type="button">再来一波</button>
</div></div>

<div id="loading"><div class="box"></div><p>加载中…</p><small>正在点亮暖阳村庄</small></div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================= B' 暖阳星露谷 21 色 ================= */
const PAL = {
  ink:0x241a12, deepPanel:0x3a2a1c, panel:0x54382a, woodLt:0x6e4f3a,
  cream:0xfaf3d8, gold:0xc9a227, goldLt:0xe8c179, deepGold:0x8a6d1f,
  darkGrass:0x6b7a4f, grass:0x8a9a6b, lightGrass:0xa8b88a,
  steel:0x7a9ab0, steelDk:0x5a6a7a, leaf:0x7ab86a, skin:0xe8b88a,
  leather:0x8a5a3a, red:0xc05a4a, bone:0xe8e4d8, lime:0x9a8f80
};
const SKY = 0xf7e9c4;           // 暖阳天空 / 雾色
const WORLD = { x: 16, z: 11 }; // 玩家活动范围（半宽）
const BOUND = { x: 17.4, z: 12.4 };

const loadingEl = document.getElementById('loading');
let started = false; // 提到最前面：error 监听里会读它，避免 TDZ
const fail = (msg) => {
  loadingEl.classList.add('err');
  loadingEl.querySelector('p').textContent = msg;
  loadingEl.querySelector('small').textContent = '请检查网络后刷新页面';
};
window.addEventListener('error', (e) => { if (!started) fail('加载失败：' + (e.message || '未知错误')); });
setTimeout(() => { if (!started) fail('加载超时：Three.js 未能载入'); }, 12000);

/* ================= 渲染器 ================= */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 26, 58);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 120);

/* ================= 光照 ================= */
scene.add(new THREE.HemisphereLight(0xfff2d0, PAL.grass, 0.95));
const sun = new THREE.DirectionalLight(0xffe9b8, 1.7);
sun.position.set(14, 20, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0015;
scene.add(sun);

/* ================= 工具：像素画布纹理 ================= */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const hex = (n) => '#' + n.toString(16).padStart(6, '0');

/* ================= 地面（草地 + 土路，一张像素纹理） ================= */
const groundTex = canvasTex(256, 192, (g, w, h) => {
  g.fillStyle = hex(PAL.grass); g.fillRect(0, 0, w, h);
  // 草地斑点
  for (let i = 0; i < 900; i++) {
    g.fillStyle = Math.random() < 0.5 ? hex(PAL.darkGrass) : hex(PAL.lightGrass);
    g.globalAlpha = 0.25 + Math.random() * 0.45;
    g.fillRect((Math.random() * w) | 0, (Math.random() * h) | 0, 2, 2);
  }
  g.globalAlpha = 1;
  // 深草 patch
  for (let i = 0; i < 14; i++) {
    g.fillStyle = hex(PAL.darkGrass); g.globalAlpha = 0.35;
    const x = Math.random() * w, y = Math.random() * h;
    g.fillRect(x, y, 10 + Math.random() * 22, 6 + Math.random() * 10);
  }
  g.globalAlpha = 1;
  // 土路：从南口 (x=2,z=13) 进村到中心，再拐向东边小屋
  // canvas: cx=(x+18)/36*256, cy=(z+13)/26*192
  const px = (x) => (x + 18) / 36 * w, py = (z) => (z + 13) / 26 * h;
  g.strokeStyle = hex(PAL.leather); g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = 20;
  g.beginPath();
  g.moveTo(px(2), py(13.5));
  g.bezierCurveTo(px(1), py(9), px(-1), py(5), px(0), py(1));
  g.bezierCurveTo(px(1), py(-2), px(5), py(-4), px(8), py(-6));
  g.stroke();
  g.strokeStyle = hex(0x6e4526); g.lineWidth = 13; // 路心深色
  g.beginPath();
  g.moveTo(px(2), py(13.5));
  g.bezierCurveTo(px(1), py(9), px(-1), py(5), px(0), py(1));
  g.bezierCurveTo(px(1), py(-2), px(5), py(-4), px(8), py(-6));
  g.stroke();
  // 路面斑点
  for (let i = 0; i < 120; i++) {
    g.fillStyle = Math.random() < 0.5 ? hex(0x6e4526) : hex(PAL.woodLt);
    g.globalAlpha = 0.5;
    const t = Math.random();
    const x = 2 + (0 - 2) * t + (Math.random() - 0.5) * 2.4;
    const z = 13.5 + (1 - 13.5) * t + (Math.random() - 0.5) * 2.4;
    g.fillRect(px(x) | 0, py(z) | 0, 2, 2);
  }
  g.globalAlpha = 1;
});
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(36, 26),
  new THREE.MeshLambertMaterial({ map: groundTex })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// 远景草地：相机跟到场地边缘时，画面外仍是草地而不是米色底
const farGrass = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.MeshLambertMaterial({ color: PAL.grass })
);
farGrass.rotation.x = -Math.PI / 2;
farGrass.position.y = -0.08;
farGrass.receiveShadow = true;
scene.add(farGrass);

/* ================= 碰撞体 ================= */
const colliders = []; // {x,z,r}
const addCollider = (x, z, r) => colliders.push({ x, z, r });
function resolveCollision(p, radius) {
  for (const c of colliders) {
    const dx = p.x - c.x, dz = p.z - c.z;
    const d = Math.hypot(dx, dz), min = c.r + radius;
    if (d < min && d > 0.0001) { p.x = c.x + dx / d * min; p.z = c.z + dz / d * min; }
  }
  p.x = Math.max(-BOUND.x, Math.min(BOUND.x, p.x));
  p.z = Math.max(-BOUND.z, Math.min(BOUND.z, p.z));
}

/* ================= 材质小帮手 ================= */
const lambert = (color, opts = {}) => new THREE.MeshLambertMaterial({ color, ...opts });
function box(w, h, d, color, x, y, z, parent, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), lambert(color));
  m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m); return m;
}

/* ================= 小屋 ================= */
function makeHouse(x, z, rotY, wallColor, roofColor) {
  const g = new THREE.Group();
  g.position.set(x, 0, z); g.rotation.y = rotY;
  box(3.4, 2.0, 2.8, wallColor, 0, 1.0, 0, g);                 // 木墙
  box(3.6, 0.35, 3.0, PAL.panel, 0, 0.18, 0, g);               // 深木基座
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.9, 1.7, 4), lambert(roofColor, { flatShading: true }));
  roof.position.y = 2.85; roof.rotation.y = Math.PI / 4; roof.castShadow = true; roof.receiveShadow = true;
  g.add(roof);
  box(0.9, 1.5, 0.12, PAL.ink, 0, 0.85, 1.44, g);              // 门
  box(0.7, 0.7, 0.1, PAL.cream, -1.0, 1.25, 1.44, g);          // 暖窗
  box(0.7, 0.7, 0.1, PAL.cream, 1.0, 1.25, 1.44, g);
  box(0.45, 1.1, 0.45, PAL.panel, 1.0, 3.1, -0.6, g);          // 烟囱
  box(0.6, 0.25, 0.6, PAL.ink, 1.0, 3.7, -0.6, g);
  scene.add(g);
  addCollider(x, z, 2.3);
  return g;
}
makeHouse(-10, -7, 0.15, PAL.woodLt, PAL.gold);
makeHouse(5, -8, -0.1, 0x7a5a40, PAL.goldLt);
makeHouse(-13, 2, Math.PI / 2 - 0.1, PAL.woodLt, PAL.gold);
makeHouse(12, -1, -Math.PI / 2 + 0.12, 0x7a5a40, PAL.gold);

/* ================= 树 ================= */
function makeTree(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.28 * s, 0.36 * s, 1.4 * s, 6), lambert(PAL.panel, { flatShading: true }));
  trunk.position.y = 0.7 * s; trunk.castShadow = true; g.add(trunk);
  const c1 = new THREE.Mesh(new THREE.ConeGeometry(1.5 * s, 2.2 * s, 7), lambert(PAL.leaf, { flatShading: true }));
  c1.position.y = 2.2 * s; c1.castShadow = true; g.add(c1);
  const c2 = new THREE.Mesh(new THREE.ConeGeometry(1.05 * s, 1.6 * s, 7), lambert(PAL.lightGrass, { flatShading: true }));
  c2.position.y = 3.3 * s; c2.castShadow = true; g.add(c2);
  scene.add(g);
  addCollider(x, z, 0.7 * s);
  return g;
}
makeTree(-6, -9.5, 1.15); makeTree(11, -7.5, 1.0); makeTree(-15.5, -3, 0.9);
makeTree(14.5, 2.5, 1.1); makeTree(-4, 9.5, 1.0); makeTree(8, 10.5, 0.9);
makeTree(-15, 8, 1.2); makeTree(15.5, -5, 0.85);

/* ================= 木栅栏 ================= */
function makeFence(x, z, rotY, len = 3) {
  const g = new THREE.Group();
  g.position.set(x, 0, z); g.rotation.y = rotY;
  for (let i = 0; i <= len; i++) box(0.16, 0.9, 0.16, PAL.leather, -len * 0.9 + i * 1.8, 0.45, 0, g);
  box(len * 1.8 + 0.2, 0.14, 0.12, PAL.woodLt, 0, 0.72, 0, g);
  box(len * 1.8 + 0.2, 0.14, 0.12, PAL.woodLt, 0, 0.38, 0, g);
  scene.add(g);
}
makeFence(-3.2, 8.6, 0.5); makeFence(6.5, 8.8, -0.4); makeFence(-8, -4.5, Math.PI / 2 + 0.2, 2);

/* ================= 池塘 ================= */
const pond = new THREE.Group();
pond.position.set(11, 0, 6);
const pondWater = new THREE.Mesh(new THREE.CircleGeometry(2.3, 24),
  new THREE.MeshLambertMaterial({ color: PAL.steel }));
pondWater.rotation.x = -Math.PI / 2; pondWater.position.y = 0.03; pondWater.receiveShadow = true;
pond.add(pondWater);
const pondHi = new THREE.Mesh(new THREE.CircleGeometry(1.5, 20),
  new THREE.MeshLambertMaterial({ color: 0x9ab8c8, transparent: true, opacity: 0.7 }));
pondHi.rotation.x = -Math.PI / 2; pondHi.position.set(-0.3, 0.045, -0.3);
pond.add(pondHi);
// 岸边石块
for (let i = 0; i < 7; i++) {
  const a = i / 7 * Math.PI * 2;
  const st = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 0), lambert(PAL.lime, { flatShading: true }));
  st.position.set(Math.cos(a) * 2.45, 0.12, Math.sin(a) * 2.45);
  st.castShadow = true; pond.add(st);
}
scene.add(pond);
addCollider(11, 6, 2.5);

/* ================= 草丛 + 野花 ================= */
const tuftGeo = new THREE.ConeGeometry(0.16, 0.55, 4);
const tuftMat = lambert(PAL.lightGrass, { flatShading: true });
const tuftMat2 = lambert(PAL.darkGrass, { flatShading: true });
for (let i = 0; i < 60; i++) {
  const x = -17 + Math.random() * 34, z = -12 + Math.random() * 24;
  if (Math.abs(x) < 3 && z > 4) continue; // 别挡路口
  const t = new THREE.Mesh(tuftGeo, Math.random() < 0.5 ? tuftMat : tuftMat2);
  t.position.set(x, 0.26, z);
  t.rotation.y = Math.random() * Math.PI;
  t.castShadow = true;
  scene.add(t);
}
const flowerColors = [PAL.gold, PAL.red, PAL.cream];
for (let i = 0; i < 18; i++) {
  const x = -16 + Math.random() * 32, z = -11 + Math.random() * 22;
  const f = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.18),
    lambert(flowerColors[i % 3], { flatShading: true }));
  f.position.set(x, 0.45, z); f.castShadow = true;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 4), lambert(PAL.darkGrass));
  stem.position.set(x, 0.2, z); scene.add(stem);
  scene.add(f);
}

/* ================= 精灵表（billboard 贴片） ================= */
function loadSpriteTex(url) {
  const t = new THREE.TextureLoader().load(url);
  t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false; t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(0.25, 0.25);
  return t;
}
const warriorTex = loadSpriteTex('warrior-64.png');
// 注意：史莱姆不用 clone() 共用贴图——clone 的 needsUpdate 不会随原图加载而更新，
// 首帧可能渲染出空贴图。每只史莱姆单独 load 一次（浏览器缓存图片，只发一次请求）。
// “闪白”不用白剪影贴图，改用加色混合自叠加（提亮变白），同样避开贴图克隆问题。
function setFrame(tex, f) {
  const col = f % 4, row = (f / 4) | 0;
  tex.offset.set(col * 0.25, 1 - (row + 1) * 0.25);
}
// 圆点粒子纹理
const dotTex = canvasTex(16, 16, (g) => {
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(8, 8, 6, 0, Math.PI * 2); g.fill();
});
// 剑光弧线纹理
const slashTex = canvasTex(128, 128, (g) => {
  g.clearRect(0, 0, 128, 128);
  g.strokeStyle = '#ffffff'; g.lineWidth = 14; g.lineCap = 'round';
  g.beginPath(); g.arc(64, 64, 42, -Math.PI * 0.75, Math.PI * 0.15); g.stroke();
  g.strokeStyle = hex(PAL.gold); g.lineWidth = 5;
  g.beginPath(); g.arc(64, 64, 50, -Math.PI * 0.7, Math.PI * 0.1); g.stroke();
});
// 圆形影子
const shadowTex = canvasTex(64, 64, (g) => {
  const grad = g.createRadialGradient(32, 32, 4, 32, 32, 30);
  grad.addColorStop(0, 'rgba(20,12,6,0.5)');
  grad.addColorStop(1, 'rgba(20,12,6,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
});
function blobShadow(scale = 1) {
  const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  m.scale.set(1.3 * scale, 0.55 * scale, 1);
  m.position.y = 0.04;
  return m;
}

/* ================= 玩家 ================= */
const player = {
  group: new THREE.Group(),
  pos: new THREE.Vector3(0, 0, 4),
  speed: 5.2, facing: Math.PI, // 面向镜头（南）
  frame: 0, animT: 0, moving: false,
  attackT: 0, attackCd: 0, hitDone: false, flip: false,
};
{
  const mat = new THREE.SpriteMaterial({ map: warriorTex, transparent: true, depthWrite: false });
  const sp = new THREE.Sprite(mat);
  sp.center.set(0.5, 0); sp.scale.set(1.7, 1.7, 1);
  player.sprite = sp;
  player.group.add(sp);
  player.group.add(blobShadow(1));
  player.group.position.copy(player.pos);
  scene.add(player.group);
}

/* ================= 史莱姆 ================= */
const SLIME_HOMES = [{ x: -3.5, z: 8.5 }, { x: 0.5, z: 9.5 }, { x: 4, z: 8 }];
const slimes = [];
function makeSlime(i) {
  const home = SLIME_HOMES[i];
  const group = new THREE.Group();
  const tex = loadSpriteTex('slime-64.png'); // 每只单独 load，见上面注释
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const flashMat = new THREE.SpriteMaterial({
    map: tex, transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.95, // 闪白：自叠加提亮
  });
  const sp = new THREE.Sprite(mat);
  sp.center.set(0.5, 0); sp.scale.set(1.25, 1.25, 1);
  group.add(sp);
  group.add(blobShadow(0.8));
  // 血条（受伤后显示）
  const hpC = document.createElement('canvas'); hpC.width = 32; hpC.height = 5;
  const hpT = new THREE.CanvasTexture(hpC);
  hpT.magFilter = THREE.NearestFilter; hpT.minFilter = THREE.NearestFilter; hpT.colorSpace = THREE.SRGBColorSpace;
  const hpSp = new THREE.Sprite(new THREE.SpriteMaterial({ map: hpT, transparent: true, depthWrite: false }));
  hpSp.scale.set(1.05, 0.16, 1); hpSp.position.y = 1.5; hpSp.visible = false;
  group.add(hpSp);
  const pos = new THREE.Vector3(home.x, 0, home.z);
  group.position.copy(pos);
  scene.add(group);
  const s = {
    group, sprite: sp, mat, flashMat, tex, hpC, hpT, hpSp,
    pos, home, hp: 3, maxHp: 3, alive: true,
    frame: 0, animT: Math.random(), target: null, idleT: Math.random() * 1.5,
    flashT: 0, hopT: Math.random() * Math.PI * 2, knock: new THREE.Vector3(),
  };
  drawHp(s);
  slimes.push(s);
  return s;
}
function drawHp(s) {
  const g = s.hpC.getContext('2d');
  g.clearRect(0, 0, 32, 5);
  g.fillStyle = '#241a12'; g.fillRect(0, 0, 32, 5);
  g.fillStyle = s.hp >= 2 ? '#7ab86a' : '#c05a4a';
  g.fillRect(1, 1, 30 * (s.hp / s.maxHp), 3);
  s.hpT.needsUpdate = true;
}
SLIME_HOMES.forEach((_, i) => makeSlime(i));
// 调试图柄：真机验证脚本用它读玩家/史莱姆位置，不影响玩法
window.__hd2d = { player, slimes };

/* ================= 死亡粒子 ================= */
const P_MAX = 60;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(P_MAX * 3);
const pCol = new Float32Array(P_MAX * 3);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const pMat = new THREE.PointsMaterial({
  size: 0.32, map: dotTex, vertexColors: true, transparent: true,
  depthWrite: false, sizeAttenuation: true,
});
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
scene.add(points);
for (let i = 0; i < P_MAX; i++) pPos[i * 3 + 1] = -100;
const parts = Array.from({ length: P_MAX }, () => ({ life: 0, vx: 0, vy: 0, vz: 0 }));
let pCursor = 0;
function burst(x, y, z) {
  const colors = [PAL.gold, PAL.leaf, PAL.cream, PAL.goldLt];
  for (let n = 0; n < 14; n++) {
    const i = pCursor; pCursor = (pCursor + 1) % P_MAX;
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 2.5;
    parts[i].life = 0.55;
    parts[i].vx = Math.cos(a) * sp; parts[i].vz = Math.sin(a) * sp;
    parts[i].vy = 2.5 + Math.random() * 3;
    pPos[i * 3] = x; pPos[i * 3 + 1] = y + 0.6; pPos[i * 3 + 2] = z;
    const c = new THREE.Color(colors[n % colors.length]);
    pCol[i * 3] = c.r; pCol[i * 3 + 1] = c.g; pCol[i * 3 + 2] = c.b;
  }
  pGeo.attributes.color.needsUpdate = true;
}

/* ================= 剑光 ================= */
const slash = new THREE.Sprite(new THREE.SpriteMaterial({
  map: slashTex, transparent: true, depthWrite: false,
  blending: THREE.AdditiveBlending, opacity: 0,
}));
slash.scale.set(2.6, 2.6, 1);
scene.add(slash);
let slashT = 0;

/* ================= 输入：键盘 ================= */
const keys = {};
window.addEventListener('keydown', (e) => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') doAttack();
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

/* ================= 输入：虚拟摇杆 ================= */
const joy = document.getElementById('joy');
const knob = document.getElementById('joyKnob');
const joyVec = { x: 0, y: 0 };
let joyId = null;
function joySet(e) {
  const r = joy.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = (e.clientX - cx) / (r.width / 2), dy = (e.clientY - cy) / (r.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  joyVec.x = dx; joyVec.y = dy;
  knob.style.transform = `translate(${dx * 34}px, ${dy * 34}px)`;
}
joy.addEventListener('pointerdown', (e) => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joySet(e); });
joy.addEventListener('pointermove', (e) => { if (e.pointerId === joyId) joySet(e); });
const joyEnd = (e) => {
  if (e.pointerId !== joyId) return;
  joyId = null; joyVec.x = 0; joyVec.y = 0; knob.style.transform = '';
};
joy.addEventListener('pointerup', joyEnd);
joy.addEventListener('pointercancel', joyEnd);

/* ================= 输入：攻击按钮 + 点史莱姆 ================= */
document.getElementById('atkBtn').addEventListener('pointerdown', (e) => { e.preventDefault(); doAttack(); });
const ray = new THREE.Raycaster();
const tapNdc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  tapNdc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(tapNdc, camera);
  const hits = ray.intersectObjects(slimes.filter((s) => s.alive).map((s) => s.sprite), false);
  if (hits.length) {
    const s = slimes.find((x) => x.sprite === hits[0].object);
    if (s) {
      player.facing = Math.atan2(s.pos.x - player.pos.x, s.pos.z - player.pos.z);
      doAttack();
    }
  }
});

/* ================= 攻击 ================= */
function doAttack() {
  if (!started || player.attackCd > 0) return;
  player.attackT = 0.42; player.attackCd = 0.5; player.hitDone = false;
  player.animT = 0;
  slashT = 0.16;
  const fx = Math.sin(player.facing), fz = Math.cos(player.facing);
  slash.position.set(player.pos.x + fx * 1.2, 1.0, player.pos.z + fz * 1.2);
  slash.material.rotation = -player.facing;
  slash.material.opacity = 1;
}
function applyAttackHit() {
  for (const s of slimes) {
    if (!s.alive) continue;
    const dx = s.pos.x - player.pos.x, dz = s.pos.z - player.pos.z;
    const d = Math.hypot(dx, dz);
    if (d > 2.4) continue;
    const ang = Math.atan2(dx, dz);
    let diff = Math.abs(ang - player.facing);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff > 1.25) continue; // 约 72° 扇形
    damageSlime(s, dx / (d || 1), dz / (d || 1));
  }
}
function damageSlime(s, nx, nz) {
  s.hp -= 1;
  s.flashT = 0.13;
  s.sprite.material = s.flashMat;
  s.knock.set(nx * 3.2, 0, nz * 3.2);
  drawHp(s); s.hpSp.visible = true;
  if (s.hp <= 0) {
    s.alive = false;
    burst(s.pos.x, 0, s.pos.z);
    s.group.visible = false;
    updateCounter();
    if (slimes.every((x) => !x.alive)) {
      setTimeout(() => document.getElementById('win').classList.add('show'), 450);
    }
  }
}
function updateCounter() {
  document.getElementById('slimeLeft').textContent = slimes.filter((s) => s.alive).length;
}
document.getElementById('againBtn').addEventListener('click', () => {
  document.getElementById('win').classList.remove('show');
  slimes.forEach((s, i) => {
    const home = SLIME_HOMES[i];
    s.alive = true; s.hp = s.maxHp;
    s.pos.set(home.x, 0, home.z);
    s.group.position.copy(s.pos);
    s.group.visible = true;
    s.sprite.material = s.mat;
    s.target = null; s.idleT = 0.5 + Math.random();
    drawHp(s); s.hpSp.visible = false;
  });
  updateCounter();
});

/* ================= 尺寸 / 像素化渲染 ================= */
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  const scale = w < 600 ? 2 : 3; // 像素倍率：手机 2 / 桌面 3
  renderer.setSize(Math.ceil(w / scale), Math.ceil(h / scale), false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* ---- 玩家移动 ---- */
  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup']) mz -= 1;
  if (keys['s'] || keys['arrowdown']) mz += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;
  mx += joyVec.x; mz += joyVec.y;
  const mLen = Math.hypot(mx, mz);
  player.moving = mLen > 0.15;
  if (player.moving) {
    mx /= Math.max(1, mLen); mz /= Math.max(1, mLen);
    player.pos.x += mx * player.speed * dt;
    player.pos.z += mz * player.speed * dt;
    resolveCollision(player.pos, 0.55);
    player.facing = Math.atan2(mx, mz);
    if (mx < -0.12) player.flip = true;
    else if (mx > 0.12) player.flip = false;
  }
  player.group.position.copy(player.pos);
  player.sprite.scale.x = (player.flip ? -1 : 1) * 1.7;

  /* ---- 玩家动画 ---- */
  player.animT += dt;
  if (player.attackT > 0) {
    player.attackT -= dt;
    const f = 8 + Math.min(3, Math.floor((0.42 - player.attackT) / 0.42 * 4));
    setFrame(warriorTex, f);
    if (!player.hitDone && player.attackT < 0.27) { player.hitDone = true; applyAttackHit(); }
  } else if (player.moving) {
    setFrame(warriorTex, 4 + Math.floor(player.animT * 9) % 4);
  } else {
    setFrame(warriorTex, Math.floor(player.animT * 5) % 4);
  }
  if (player.attackCd > 0) player.attackCd -= dt;

  /* ---- 剑光 ---- */
  if (slashT > 0) {
    slashT -= dt;
    slash.material.opacity = Math.max(0, slashT / 0.16);
    slash.scale.setScalar(2.6 + (0.16 - slashT) * 3);
  } else slash.material.opacity = 0;

  /* ---- 史莱姆 ---- */
  for (const s of slimes) {
    if (!s.alive) continue;
    // 击退
    if (s.knock.lengthSq() > 0.01) {
      s.pos.addScaledVector(s.knock, dt);
      s.knock.multiplyScalar(Math.max(0, 1 - dt * 8));
      resolveCollision(s.pos, 0.4);
    }
    // 靠近玩家时追过来（演示要打得到怪），否则小范围游荡
    const pdx = player.pos.x - s.pos.x, pdz = player.pos.z - s.pos.z;
    if (Math.hypot(pdx, pdz) < 6.5) { s.target = { x: player.pos.x, z: player.pos.z }; s.idleT = 0; }
    if (s.idleT > 0) {
      s.idleT -= dt;
      if (s.idleT <= 0) {
        const a = Math.random() * Math.PI * 2, r = 0.5 + Math.random() * 1.5;
        s.target = { x: s.home.x + Math.cos(a) * r, z: s.home.z + Math.sin(a) * r };
      }
    } else if (s.target) {
      const dx = s.target.x - s.pos.x, dz = s.target.z - s.pos.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.15) { s.target = null; s.idleT = 1 + Math.random() * 1.5; }
      else {
        s.pos.x += dx / d * 0.9 * dt;
        s.pos.z += dz / d * 0.9 * dt;
        resolveCollision(s.pos, 0.4);
      }
    }
    // 弹跳 + 帧
    s.hopT += dt * (s.target ? 7 : 3.5);
    const hop = Math.abs(Math.sin(s.hopT)) * 0.14;
    s.group.position.set(s.pos.x, hop, s.pos.z);
    s.animT += dt;
    const f = s.target ? 4 + Math.floor(s.animT * 8) % 4 : Math.floor(s.animT * 4) % 4;
    setFrame(s.tex, f);
    // 闪白结束
    if (s.flashT > 0) {
      s.flashT -= dt;
      if (s.flashT <= 0) s.sprite.material = s.mat;
    }
  }

  /* ---- 粒子 ---- */
  let pDirty = false;
  for (let i = 0; i < P_MAX; i++) {
    const p = parts[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { pPos[i * 3 + 1] = -100; pDirty = true; continue; }
    p.vy -= 7 * dt;
    pPos[i * 3] += p.vx * dt; pPos[i * 3 + 1] += p.vy * dt; pPos[i * 3 + 2] += p.vz * dt;
    if (pPos[i * 3 + 1] < 0.05) { pPos[i * 3 + 1] = 0.05; p.vy *= -0.4; }
    pDirty = true;
  }
  if (pDirty) pGeo.attributes.position.needsUpdate = true;

  /* ---- 池塘微光 ---- */
  pondHi.material.opacity = 0.55 + Math.sin(t * 1.4) * 0.18;

  /* ---- 相机跟随（俯视微倾，竖屏拉远） ---- */
  const aspect = camera.aspect;
  const dist = aspect < 0.8 ? 1.38 : aspect < 1.2 ? 1.18 : 1;
  tmpV.set(player.pos.x, 13 * dist, player.pos.z + 9.5 * dist);
  camera.position.lerp(tmpV, 1 - Math.pow(0.001, dt));
  camera.lookAt(player.pos.x, 0.4, player.pos.z);

  renderer.render(scene, camera);
}
animate();
started = true;
window.__hd2dStarted = true;
loadingEl.style.display = 'none';
</script>
<script>
// import 失败时 module 根本不执行，上面那个 12 秒超时也跑不到；这里用普通脚本兜底
setTimeout(function () {
  if (!window.__hd2dStarted) {
    var l = document.getElementById('loading');
    if (l) {
      l.classList.add('err');
      l.querySelector('p').textContent = '加载超时：Three.js 未能载入';
      l.querySelector('small').textContent = '请检查网络后刷新页面';
    }
  }
}, 15000);
</script>
